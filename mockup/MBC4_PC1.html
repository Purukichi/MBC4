<title>MBC4 PC1 Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: var(--cell); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #tip { position: fixed; pointer-events: none; display: none; z-index: 3;
         background: var(--tipBg); color: var(--tipText); border-radius: 3px; box-sizing: border-box; }
  #tip .h { font-family: "Chivo Mono", monospace; font-weight: 400; color: #FF4D0F; text-transform: uppercase; }
  #tip .b { font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", sans-serif; line-height: 1.55; }
  #edit { position: fixed; display: none; z-index: 4; box-sizing: border-box; margin: 0; padding: 0 2px;
          border: 1px solid var(--rule); border-radius: 0; outline: none; background: var(--plot); color: var(--ink);
          font-family: "Chivo Mono", monospace; font-weight: 300; text-align: center; }
</style>
<canvas id="c"></canvas>
<div id="tip"><div class="h"></div><div class="b"></div></div>
<input id="edit" spellcheck="false" autocomplete="off">
<script>
'use strict';
// ───────────────────────────────── tokens
let W = 0;                                                 // set from the panel state below
const H = 520;
const THEMES = {
  light: { cell: '#EDEEEA', ink: '#0D0E0C', ink2: '#454642', ink3: '#7C7D78', rule: '#B8B9B4',
           off: '#DADBD6', lit: '#A9AAA5', kept: '#969792', plot: '#F9F9F6', acc: '#FF4D0F', ghost: '#CFD0CB',
           dLit: '#C6C7C2', dKnob: '#A0A19C', dText: '#A7A8A3', onInk: '#F9F9F6',
           tipBg: 'rgba(13,14,12,.96)', tipText: '#F9F9F6' },
  dark:  { cell: '#171816', ink: '#E9EAE6', ink2: '#B3B4AF', ink3: '#83847F', rule: '#3D3E3B',
           off: '#262724', lit: '#50514D', kept: '#60615C', plot: '#30312E', acc: '#FF4D0F', ghost: '#2E2F2C',
           dLit: '#343532', dKnob: '#4F504C', dText: '#4C4D49', onInk: '#171816',
           tipBg: 'rgba(42,43,40,.97)', tipText: '#E9EAE6' },
};
// theme is one setting per user, shared by every plugin (PC1-style/settings.cfg in the plugin; localStorage here)
let theme = 'light', C = THEMES.light;
try { if (localStorage.getItem('pc1style.theme') === 'dark') theme = 'dark'; } catch {}
function applyTheme(t) {
  theme = t; C = THEMES[t];
  for (const [key, v] of Object.entries(C)) document.documentElement.style.setProperty('--' + key, v);
  try { localStorage.setItem('pc1style.theme', t); } catch {}
}
applyTheme(theme);
const LABEL = { size: 8, w: 400, ls: 0.8 }, VAL = { size: 9, w: 300, ls: 0 },
      NOTE = { size: 7.5, w: 300, ls: 0.6 }, TICK = { size: 7.5, w: 300, ls: 0 },
      TINY = { size: 6, w: 300, ls: 0 };                     // the number riding on a band's GR bar

// ───────────────────────────────── layout (10 px grid)
const STRIP_W = 260, COL_L = 20, COL_R = COL_L + 4 * STRIP_W, ROW_B = 320;
// the INPUT / OUTPUT panel folds away on the right (I/O button); open, the window grows by IO_W
const W_FOLD = COL_R + 20, IO_W = 130, OUT_COL = COL_R + IO_W / 2, IO_R = [COL_R - 34, 27, 24, 16];
let ioOpen = false, FRAME_R = 0;
function layoutIo() { W = W_FOLD + (ioOpen ? IO_W : 0); FRAME_R = W - 20; }
layoutIo();
const PX0 = COL_L + 10, PX1 = COL_R - 50, PY0 = 80, PY1 = 280;          // plot: 225 × 50 cells
const NC = 225, DBT = 6, DBB = -72;                       // simulated columns, dB range
const FAD_T = ROW_B + 20, FAD_Y = FAD_T + 22, FAD_ROWS = 23;  // vertical faders: 23 cells, 362 – 453
const FAD_V = FAD_Y + 102, FAD_H = FAD_V + 7 - FAD_T;          // value row, level with the last slider row
const FRAME_B = FAD_V + 16, FOOT_Y = FRAME_B + 11;
const IN_X = COL_R + IO_W / 4, OUT_X = OUT_COL + IO_W / 4, MTR_V = PY1 + 26;   // meters; gain value under the readout
const SL_X = 46, SL_CELLS = 36, SL_W = 100 + 4 * SL_CELLS;                 // horizontal sliders, from band x0

// ───────────────────────────────── canvas
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BASE = 1;                                            // "100 %" draws the design units as they are
let s = 1, k = 1, zoom = BASE;                             // zoom: the UI size (75 – 125 % of BASE)
function fit() {
  const dpr = window.devicePixelRatio || 1;
  s = Math.min(zoom, innerWidth / W, innerHeight / H);
  k = s * dpr;
  cv.width = Math.round(W * k); cv.height = Math.round(H * k);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  // inside a host page (daw_sim.html): ask for the window size this layout wants, like the plugin asks the DAW
  if (window.parent !== window) window.parent.postMessage({ mbc4Size: [Math.round(W * zoom), Math.round(H * zoom)] }, '*');
}

// pixel-snapped rect in base units (identity transform)
function R(x, y, w, h, c) {
  const x0 = Math.round(x * k), y0 = Math.round(y * k);
  ctx.fillStyle = c;
  ctx.fillRect(x0, y0, Math.max(1, Math.round((x + w) * k) - x0), Math.max(1, Math.round((y + h) * k) - y0));
}
// cells on a whole-device-pixel pitch: every cell and gap has one size at any zoom
function Lat(x, y, pitch = 4, cell = 3) {
  const gap = Math.max(1, Math.round((pitch - cell) * k));
  const P = Math.max(gap + 1, Math.round(pitch * k));
  const L = { P, gap, C: P - gap, x0: Math.round(x * k), y0: Math.round(y * k) };
  L.fit = len => Math.max(1, Math.floor((Math.round(len * k) + gap) / P));
  L.add = (p, i, j, ni = 1, nj = 1) => p.rect(L.x0 + i * P, L.y0 + j * P, ni * P - gap, nj * P - gap);
  L.cx = i => (L.x0 + i * P + L.C / 2) / k;     // cell centre, base units
  L.cy = j => (L.y0 + j * P + L.C / 2) / k;
  L.ext = n => (n * P - gap) / k;
  return L;
}
// rules: 0.2 px
// reference lines: never under one device pixel
const dev = t => Math.max(1, Math.round(t * k));
function lineH(x1, x2, y, c, t = 0.5) { const d = dev(t); ctx.fillStyle = c; ctx.fillRect(Math.round(x1 * k), Math.round(y * k - d / 2), Math.round((x2 - x1) * k), d); }
function lineV(x, y1, y2, c, t = 0.5) { const d = dev(t); ctx.fillStyle = c; ctx.fillRect(Math.round(x * k - d / 2), Math.round(y1 * k), d, Math.round((y2 - y1) * k)); }

function font(o) { return `${o.w} ${o.size}px "Chivo Mono", monospace`; }
function T(str, x, y, o, c = C.ink, al = 'left') {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.font = font(o); ctx.letterSpacing = o.ls + 'px';
  ctx.fillStyle = c; ctx.textAlign = al; ctx.textBaseline = 'middle';
  // on whole device pixels, so the small sizes stay sharp
  const px = v => Math.round(v * k) / k;
  ctx.fillText(str, px(al === 'center' ? x + o.ls / 2 : x), px(y));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function tw(str, o) { ctx.font = font(o); ctx.letterSpacing = o.ls + 'px'; return ctx.measureText(str).width; }
function pill(x, y, w, h, fill, stroke) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1 / k; ctx.stroke(); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function bubble(str, x, y) {
  const w = tw(str, VAL) + 10, h = 14;
  const bx = Math.min(Math.max(x - w / 2, PX0), PX1 - w), by = y - h / 2;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 3); ctx.fillStyle = C.ink; ctx.fill();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  T(str, bx + w / 2, by + h / 2, VAL, C.onInk, 'center');
}

// ───────────────────────────────── dot glyphs
const LOGO = {
  M: ['10001','11011','10101','10001','10001'],   // 5 x 5 cells
  B: ['11110','10001','11110','10001','11110'],
  C: ['01111','10000','10000','10000','01111'],
  '4': ['10010','10010','11111','00010','00010'],
};

// ───────────────────────────────── parameters
const lin = (a, b) => ({ n: v => (v - a) / (b - a), v: n => a + n * (b - a) });
const skew = (a, b, c) => { const e = Math.log(0.5) / Math.log((c - a) / (b - a));
  return { n: v => Math.pow(Math.max(0, (v - a) / (b - a)), e), v: n => a + (b - a) * Math.pow(n, 1 / e) }; };
const num = v => { let r = Math.round(v * 10) / 10; if (Object.is(r, -0)) r = 0; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const fdB = v => num(v) + ' dB', fpct = v => Math.round(v) + ' %';
const fms = v => (v < 10 ? (Math.round(v * 10) / 10).toFixed(1) : String(Math.round(v))) + ' ms';
const fq = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + 'k' : String(Math.round(f));
const fHz = f => f >= 1000 ? fq(f) + 'Hz' : Math.round(f) + ' Hz';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const SP = {
  thr:  { min: -60, max: 0, def: 0, step: 1, fine: 0.1, m: lin(-60, 0), f: fdB },
  rat:  { min: 1, max: 20, def: 2, list: [1, 1.5, 2, 3, 4, 6, 8, 10, 20], fine: 0.1, m: skew(1, 20, 4),
          f: v => v >= 19.95 ? '20:1' : num(v) + ':1' },
  kne:  { min: 0, max: 24, def: 6, step: 1, fine: 0.1, m: lin(0, 24), f: fdB },
  atk:  { min: 0.1, max: 300, list: [0.1, 0.3, 1, 2, 3, 5, 8, 10, 15, 20, 30, 50, 80, 100, 150, 200, 300],
          fine: 0.1, m: skew(0.1, 300, 15), f: fms },
  rls:  { min: 5, max: 3000, list: [5, 10, 20, 30, 50, 80, 120, 180, 250, 350, 500, 750, 1000, 1500, 2000, 3000],
          fine: 1, m: skew(5, 3000, 200), f: fms },
  gain: { min: -24, max: 24, def: 0, step: 1, fine: 0.1, m: lin(-24, 24), f: fdB, bip: 0 },
  io:   { min: -36, max: 36, def: 0, step: 1, fine: 0.1, m: lin(-36, 36), f: fdB, bip: 0 },   // input / output gain
  mix:  { min: 0, max: 100, def: 100, step: 5, fine: 1, m: lin(0, 100), f: fpct },
  look: { min: 0, max: 10, def: 0, step: 0.5, fine: 0.1, m: lin(0, 10), f: fms },
};
function snap(sp, v, fine) {
  v = clamp(v, sp.min, sp.max);
  if (fine) return clamp(Math.round(v / sp.fine) * sp.fine, sp.min, sp.max);
  if (sp.list) { const n = sp.m.n(v); return sp.list.reduce((a, b) => Math.abs(sp.m.n(b) - n) < Math.abs(sp.m.n(a) - n) ? b : a); }
  return clamp(Math.round(v / sp.step) * sp.step, sp.min, sp.max);
}

const ATK = [25, 15, 8, 3], RLS = [250, 180, 120, 80];
const bands = [0, 1, 2, 3].map(i => ({
  thr: [-16, -36, -34, -30][i], rat: [3, 4, 2, 3][i], kne: 6, atk: ATK[i], rls: RLS[i],
  gain: 0, mix: 100, solo: false, mute: false, byp: false,
  gr: 0, learn: null,
}));
const XO_DEF = [120, 1000, 6000];
const xo = XO_DEF.slice();
const G = { gin: 0, gout: 0, mix: 100, look: 0 };       // the spectrum always shows IN + OUT

const TIP = {
  thr:  ['Threshold', 'この値を超えた分を圧縮します。グラフの横線をドラッグしても変えられます。'],
  gain: ['Gain', 'バンドの出力ゲイン（メイクアップ）。'],
  gr:   ['Gain reduction', 'いま削られている量。数値は少し保持してから更新します。'],
  rat:  ['Ratio', '圧縮の比率。'],
  kne:  ['Knee', 'スレッショルド付近を滑らかにする幅。'],
  atk:  ['Attack', '圧縮がかかり始めるまでの速さ。'],
  rls:  ['Release', '圧縮が戻るまでの速さ。'],
  mix:  ['Mix', 'バンド内のドライ／ウェットの割合。'],
  match:['Gain match', '3 秒間の平均ゲインリダクションを測って、ゲインを 1 回だけ合わせます。もう一度押すと取り消します。'],
  S:    ['Solo', 'このバンドだけを聴きます。'],
  M:    ['Mute', 'このバンドを消音します。'],
  B:    ['Bypass', 'このバンドの圧縮を止めます。'],
  gin:  ['Input', '入力ゲイン。'],
  gout: ['Output', '出力ゲイン。'],
  gmix: ['Mix', '全体のドライ／ウェットの割合。'],
  look: ['Lookahead', '先読み時間。レイテンシとしてホストに報告します。'],
  reset:['Reset', 'すべてのつまみとクロスオーバーを初期値に戻します。Ctrl+Z で元に戻せます。'],
  theme:['Theme', 'ライト / ダークを切り替えます。すべての PC1 系プラグインで共通の設定です。'],
  size: ['UI size', 'エディターの大きさ。右下の角をドラッグすると 75 – 125 % の間で細かく変えられます。'],
};

// ───────────────────────────────── controls
const ctls = [];
function addV(cx, obj, key, sp, label, tip, dis, def) {
  ctls.push({ kind: 'v', cx, obj, key, sp, label, tip: TIP[tip], tipKey: 'v' + cx, dis, def: def ?? sp.def,
              r: [cx - 14, FAD_T, 28, FAD_H], vr: [cx - 22, FAD_V - 7, 44, 14] });
}
// input / output gain: the knob sits on the meter's own rows
function addM(cx, obj, key, sp, tip) {
  ctls.push({ kind: 'v', onMeter: true, side: true, cx, obj, key, sp, tip: TIP[tip], tipKey: 'm' + cx, def: sp.def,
              r: [cx - 14, PY0, 28, PY1 - PY0], vr: [cx - 22, MTR_V - 7, 44, 14] });
}
function addH(x0, yc, obj, key, sp, label, tip, dis, def) {
  ctls.push({ kind: 'h', x0, yc, obj, key, sp, label, tip: TIP[tip], tipKey: 'h' + x0 + ':' + yc, dis, def: def ?? sp.def,
              r: [x0 + 6, yc - 7, SL_W, 14], vr: [x0 + SL_W - 48, yc - 7, 50, 14] });
}
bands.forEach((b, i) => {
  const x0 = COL_L + STRIP_W * i, dis = () => b.byp;
  // the threshold lives on the graph; everything else is a horizontal slider, level with the first fader cells
  ['rat', 'kne', 'atk', 'rls', 'gain', 'mix'].forEach((key, j) =>
    addH(x0, FAD_Y + 2 + 20 * j, b, key, SP[key], { rat: 'RAT', kne: 'KNE', atk: 'ATK', rls: 'RLS', gain: 'GAIN', mix: 'MIX' }[key], key, dis,
         key === 'atk' ? ATK[i] : key === 'rls' ? RLS[i] : undefined));
  [['S', 'solo'], ['M', 'mute'], ['B', 'byp']].forEach(([l, key], j) =>
    ctls.push({ kind: 't', b, i, key, label: l, tip: TIP[l], tipKey: 't' + i + l,   // letter buttons, 12 × 16, no gaps
                r: [x0 + STRIP_W - 10 - 12 * (3 - j), ROW_B + 7, 12, 16] }));
  ctls.push({ kind: 'match', b, i, tip: TIP.match, tipKey: 'm' + i, r: [x0 + STRIP_W - 10 - 36 - 6 - 42, ROW_B + 7, 42, 16] });   // header, 6 left of S / M / B
});
addM(IN_X, G, 'gin', SP.io, 'gin');
addM(OUT_X, G, 'gout', SP.io, 'gout');
addV(OUT_COL - 18, G, 'look', SP.look, 'LOOK', 'look', null);
addV(OUT_COL + 18, G, 'mix', SP.mix, 'MIX', 'gmix', null);
ctls.forEach(ct => { if (ct.obj === G) ct.side = true; });   // the panel's controls
ctls.push({ kind: 'io', tip: ['I/O', 'INPUT / OUTPUT（入出力ゲイン、メーター、lookahead、全体の mix）を右側に開きます。もう一度押すと格納します。'], tipKey: 'io', r: IO_R });
// footer (system bar), right to left: UI size → 10 → theme · reset (hit = content + 6, no gaps); resize corner
const SIZES = [[0.75 * BASE, '75'], [BASE, '100'], [1.25 * BASE, '125']], IW = 7.5 + 6;
function buildFooter() {
  for (let i = ctls.length - 1; i >= 0; --i) if (ctls[i].kind === 'size' || ctls[i].kind === 'icon' || ctls[i].kind === 'corner') ctls.splice(i, 1);
  let x = FRAME_R;
  for (let i = SIZES.length - 1; i >= 0; --i) {
    const w = tw(SIZES[i][1], NOTE) - NOTE.ls + 6; x -= w;
    ctls.push({ kind: 'size', v: SIZES[i][0], label: SIZES[i][1], tip: TIP.size, tipKey: 'size', r: [x, FOOT_Y - 7, w, 14] });
  }
  x -= 10;
  ['theme', 'reset'].forEach(act => { x -= IW; ctls.push({ kind: 'icon', act, tip: TIP[act], tipKey: act, r: [x, FOOT_Y - 7, IW, 14] }); });
  ctls.push({ kind: 'corner', r: [W - 16, H - 16, 16, 16] });
}
// line icons in a 7.5 box (the note text's size), strokes 1/8 of it, butt ends, sharp corners
function icon(act, cx, cy, color) {
  const B = 7.5, t = Math.max(1 / k, B / 8);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = t; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  if (act === 'reset') {
    // a full-size circle open between 1 and 2 o'clock, a filled arrow head on the 2 o'clock end
    const r = B / 2 - t / 2, a0 = -30 * Math.PI / 180;
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + 330 * Math.PI / 180); ctx.stroke();
    const ex = cx + r * Math.cos(a0), ey = cy + r * Math.sin(a0), tx = Math.sin(a0), ty = -Math.cos(a0);
    ctx.beginPath(); ctx.moveTo(ex + tx * 2.4, ey + ty * 2.4);
    ctx.lineTo(ex - ty * 1.7, ey + tx * 1.7); ctx.lineTo(ex + ty * 1.7, ey - tx * 1.7); ctx.fill();
  } else {
    // theme: a full-size square, left half filled
    ctx.strokeRect(cx - B / 2 + t / 2, cy - B / 2 + t / 2, B - t, B - t);
    ctx.fillRect(cx - B / 2, cy - B / 2, B / 2, B);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}


// ───────────────────────────────── plot mapping
const fx = f => PX0 + (PX1 - PX0) * Math.log(f / 20) / Math.log(1000);
const xf = x => 20 * Math.pow(1000, (x - PX0) / (PX1 - PX0));
const dy = d => PY1 - (d - DBB) / (DBT - DBB) * (PY1 - PY0);
const yd = y => DBB + (PY1 - y) / (PY1 - PY0) * (DBT - DBB);
const rowsFor = (d, rows) => clamp(Math.floor((d - DBB) / ((DBT - DBB) / rows) + 1e-6), 0, rows);
const bandOf = f => f < xo[0] ? 0 : f < xo[1] ? 1 : f < xo[2] ? 2 : 3;
function bandSpan(i) { return [i === 0 ? PX0 : fx(xo[i - 1]), i === 3 ? PX1 : fx(xo[i])]; }

// ───────────────────────────────── signal simulation
const freqs = Float32Array.from({ length: NC }, (_, c) => 20 * Math.pow(1000, (c + 0.5) / NC));
const nz = new Float32Array(NC), inDb = new Float32Array(NC), outDb = new Float32Array(NC), cutDb = new Float32Array(NC);
// what the graph shows: the same ballistics as the plugin (per 60 Hz tick: rise 0.25, fall 0.06)
const dIn = new Float32Array(NC).fill(-100), dOut = new Float32Array(NC).fill(-100), dCut = new Float32Array(NC).fill(-100);
let kick = 0, hat = 0, tPrev = 0;
const meters = { in: [-60, -60], out: [-60, -60], inPk: -72, outPk: -72, inHold: 0, outHold: 0 };

function shape(f) {
  let d = -36 - 3.0 * Math.log2(f / 1000);
  d += 16 * Math.exp(-Math.pow(Math.log2(f / 70) / 0.8, 2));
  d += 5 * Math.exp(-Math.pow(Math.log2(f / 3200) / 0.7, 2));
  if (f < 32) d -= (32 - f) * 0.9;
  if (f > 12000) d -= (f - 12000) / 900;
  return d;
}
function grOf(L, b) {
  const o = L - b.thr, kn = b.kne, sl = 1 - 1 / b.rat;
  let g;
  if (kn <= 0) g = o > 0 ? sl * o : 0;
  else if (2 * o < -kn) g = 0;
  else if (2 * o <= kn) g = sl * (o + kn / 2) * (o + kn / 2) / (2 * kn);
  else g = sl * o;
  return g;
}
const dbsum = arr => { let e = 0; for (const v of arr) if (v > -200) e += Math.pow(10, v / 10); return e > 0 ? 10 * Math.log10(e) : -200; };

function sim(t, dt) {
  const beat = 0.5;
  if (Math.floor(t / beat) !== Math.floor(tPrev / beat)) kick = 1;
  if (Math.floor((t + beat / 2) / (beat / 2)) !== Math.floor((tPrev + beat / 2) / (beat / 2))) hat = 1;
  tPrev = t;
  kick *= Math.exp(-dt * 5); hat *= Math.exp(-dt * 12);

  const f30 = dt * 30;                                    // the noise was tuned per 30 Hz step
  for (let c = 0; c < NC; ++c) nz[c] = nz[c] * Math.pow(0.85, f30) + (Math.random() - 0.5) * 2.6 * Math.sqrt(f30);
  const anySolo = bands.some(b => b.solo);
  const grMax = [0, 0, 0, 0];
  for (let c = 0; c < NC; ++c) {
    let sm = 0; for (let j = -3; j <= 3; ++j) sm += nz[clamp(c + j, 0, NC - 1)];
    const f = freqs[c];
    const L = shape(f) + G.gin + sm * 0.8 + 2 * Math.sin(t * 0.7 + c * 0.04)
            + kick * 11 * Math.exp(-Math.pow(Math.log2(f / 70) / 1.1, 2))
            + hat * 7 * Math.exp(-Math.pow(Math.log2(f / 7000) / 0.9, 2));
    const bi = bandOf(f), b = bands[bi];
    const silent = b.mute || (anySolo && !b.solo);
    const g = b.byp ? 0 : grOf(L, b) * b.mix / 100;
    const wet = L - g + (b.byp ? 0 : b.gain);
    const m = G.mix / 100;
    inDb[c] = L;
    cutDb[c] = L - g;
    outDb[c] = silent ? -200 : 10 * Math.log10(m * Math.pow(10, wet / 10) + (1 - m) * Math.pow(10, L / 10)) + G.gout;
    if (g > grMax[bi]) grMax[bi] = g;
  }
  const f60 = dt * 60;
  const glide = (d, v) => { for (let c = 0; c < NC; ++c) { const x = Math.max(v[c], -100), k = x > d[c] ? 0.25 : 0.06; d[c] += (x - d[c]) * (1 - Math.pow(1 - k, f60)); } };
  glide(dIn, inDb); glide(dOut, outDb); glide(dCut, cutDb);
  bands.forEach((b, i) => {
    const rel = Math.exp(-dt * 1000 / Math.max(b.rls, 20)), atk = Math.exp(-dt * 1000 / Math.max(b.atk * 4, 10));
    const tg = grMax[i] * 0.8;
    b.gr = tg > b.gr ? tg + (b.gr - tg) * atk : tg + (b.gr - tg) * rel;
    if (b.learn) { b.learn.sum += b.gr; b.learn.n++; if (t - b.learn.t0 >= 3) { b.gain = clamp(Math.round(b.learn.sum / b.learn.n * 10) / 10, -24, 24); b.learn = null; } }
  });

  // stereo meters from the summed spectra
  const li = dbsum(inDb) - 19, lo = dbsum(outDb) - 19;
  const ball = (cur, v) => v > cur ? v : cur - dt * 26;
  meters.in = [ball(meters.in[0], li), ball(meters.in[1], li - 0.7 + Math.random() * 0.5)];
  meters.out = [ball(meters.out[0], lo), ball(meters.out[1], lo - 0.7 + Math.random() * 0.5)];
  const hold = (pk, hk, v) => { if (v >= meters[pk] || (meters[hk] -= dt) <= 0) { meters[pk] = v; meters[hk] = 1.5; } };
  hold('inPk', 'inHold', Math.max(...meters.in));
  hold('outPk', 'outHold', Math.max(...meters.out));
}

// ───────────────────────────────── drawing
function header(name, x, y, c = C.ink) {   // section name only (no number)
  T(name, x, y, LABEL, c);
}

function drawGraph() {
  const paths = new Map();
  const P = col => { let p = paths.get(col); if (!p) { p = new Path2D(); paths.set(col, p); } return p; };
  // the cut fades from its tip to its root with the wet share (band mix × global mix): opaque at 100 %
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const fade = a => { const [p, q] = [hexRgb(C.cell), hexRgb(C.acc)]; return 'rgb(' + p.map((v, i) => Math.round(v + (q[i] - v) * a)).join(',') + ')'; };
  // how many cells fit depends a little on the zoom; the simulation runs on NC fixed columns
  const L = Lat(PX0, PY0), cols = L.fit(PX1 - PX0), rows = L.fit(PY1 - PY0);
  const at = (arr, i) => { i = clamp(i, 0, NC - 1); const i0 = Math.floor(i), i1 = Math.min(NC - 1, i0 + 1); return arr[i0] + (i - i0) * (arr[i1] - arr[i0]); };
  for (let c = 0; c < cols; ++c) {
    const idx = Math.log(xf(L.cx(c)) / 20) / Math.log(1000) * NC - 0.5;
    const nIn = rowsFor(at(dIn, idx), rows), nOut = rowsFor(at(dOut, idx), rows), nCut = rowsFor(at(dCut, idx), rows);
    const b = bands[bandOf(xf(L.cx(c)))], wet = b.mix / 100 * G.mix / 100, r0 = Math.max(nCut, nOut);
    for (let j = 0; j < rows; ++j) {
      let col = C.off;
      if (j < nOut) col = C.kept;
      else if (j >= nCut && j < nIn) {
        const t = nIn > r0 + 1 ? (j - r0) / (nIn - r0 - 1) : 1;
        col = wet >= 0.999 ? C.acc : fade(wet + (1 - wet) * clamp(t, 0, 1));
      }
      else if (j < nIn) col = C.ghost;
      L.add(P(col), c, rows - 1 - j);
    }
  }
  for (const [col, p] of paths) { ctx.fillStyle = col; ctx.fill(p); }

  // crossovers and thresholds
  xo.forEach((f, i) => {
    const on = isHot('xo', i);
    lineV(fx(f), PY0, PY1, C.ink, on ? 1.2 : 0.5);
  });
  bands.forEach((b, i) => {
    const [l, r] = bandSpan(i), on = isHot('thr', i);
    lineH(l, r, dy(b.thr), b.byp ? C.dKnob : C.ink, on ? 1.2 : 0.5);
    T('ABCD'[i], l + 3, 70, LABEL, b.byp ? C.dText : C.ink2);
    drawGr(b, l + 3, dy(b.thr) + 6);
  });
  for (let d = 0; d >= -72; d -= 12) T(String(d), PX1 + 7, dy(d), TICK, C.ink2);
  [[50, '50'], [100, '100'], [200, '200'], [500, '500'], [1000, '1k'], [2000, '2k'], [5000, '5k'], [10000, '10k']]
    .forEach(([f, l]) => T(l, fx(f), PY1 + 12, TICK, C.ink2, 'center'));
}

function drawMeter(cx, lv, pk) {
  // same lattice rows as the graph
  const L = Lat(cx - 3.5, PY0), rows = L.fit(PY1 - PY0);
  const p0 = new Path2D(), pa = new Path2D(), pk0 = new Path2D();
  const ref = rowsFor(0, rows);
  lv.forEach((v, ch) => {
    const n = rowsFor(v, rows);
    for (let j = 0; j < rows; ++j) {
      const p = j >= n ? p0 : j >= ref ? pa : pk0;
      L.add(p, ch, rows - 1 - j);
    }
  });
  ctx.fillStyle = C.off; ctx.fill(p0);
  ctx.fillStyle = C.kept; ctx.fill(pk0);
  ctx.fillStyle = C.acc; ctx.fill(pa);
  lineH(L.x0 / k, L.x0 / k + L.ext(2), dy(0), C.ink);
  const v = Math.max(pk, -72);
  T(pk <= -72 ? '--.-' : (v > 0 ? '+' : '') + v.toFixed(1), cx, PY1 + 12, VAL, pk > 0 ? C.acc : C.ink, 'center');
}

function drawV(ct) {
  const { cx, sp } = ct, v = ct.obj[ct.key], dis = ct.dis && ct.dis();
  if (ct.onMeter) {
    const L = Lat(cx - 3.5, PY0), rows = L.fit(PY1 - PY0), r = Math.round(sp.m.n(v) * (rows - 1));
    const pk = new Path2D(); L.add(pk, 0, rows - 1 - r, 2, 1);
    ctx.fillStyle = C.ink; ctx.fill(pk);
    T(sp.f(v), cx, MTR_V, VAL, C.ink, 'center');
    return;
  }
  const r = Math.round(sp.m.n(v) * (FAD_ROWS - 1));
  const b0 = sp.bip != null ? Math.round(sp.m.n(sp.bip) * (FAD_ROWS - 1)) : 0;
  const lo = Math.min(b0, r), hi = Math.max(b0, r);
  const L = Lat(cx - 3.5, FAD_Y);
  const pOff = new Path2D(), pLit = new Path2D(), pKnob = new Path2D();
  for (let j = 0; j < FAD_ROWS; ++j) {
    const p = j === r ? pKnob : (j >= lo && j <= hi ? pLit : pOff);
    L.add(p, 0, FAD_ROWS - 1 - j); L.add(p, 1, FAD_ROWS - 1 - j);
  }
  ctx.fillStyle = C.off; ctx.fill(pOff);
  ctx.fillStyle = dis ? C.dLit : C.lit; ctx.fill(pLit);
  ctx.fillStyle = dis ? C.dKnob : C.ink; ctx.fill(pKnob);
  T(ct.label, cx, FAD_T + 7, LABEL, dis ? C.dText : C.ink, 'center');
  T(sp.f(v), cx, FAD_V, VAL, dis ? C.dText : C.ink, 'center');
}

function drawH(ct) {
  const { x0, yc, sp } = ct, v = ct.obj[ct.key], dis = ct.dis && ct.dis();
  const r = Math.round(sp.m.n(v) * (SL_CELLS - 1));
  const L = Lat(x0 + SL_X, yc - 1.5);
  const pOff = new Path2D(), pLit = new Path2D(), pKnob = new Path2D();
  for (let j = 0; j < SL_CELLS; ++j) L.add(j === r ? pKnob : j < r ? pLit : pOff, j, 0);
  ctx.fillStyle = C.off; ctx.fill(pOff);
  ctx.fillStyle = dis ? C.dLit : C.lit; ctx.fill(pLit);
  ctx.fillStyle = dis ? C.dKnob : C.ink; ctx.fill(pKnob);
  T(ct.label, x0 + 10, yc, LABEL, dis ? C.dText : C.ink);
  T(sp.f(v), x0 + SL_W + 2, yc, VAL, dis ? C.dText : C.ink, 'right');
}

function drawBand(i) {
  const b = bands[i], x0 = COL_L + STRIP_W * i, dis = b.byp;
  header('ABCD'[i], x0 + 10, ROW_B + 15, dis ? C.dText : C.ink);
  const lo = i === 0 ? 20 : xo[i - 1], hi = i === 3 ? 20000 : xo[i];
  T(fq(lo) + '–' + fq(hi) + ' Hz', x0 + 22, ROW_B + 15, VAL, dis ? C.dText : C.ink2);
}

// a band's gain reduction under the left end of its threshold line, every frame (60 Hz):
// fine dots (1.6 on 2, 2 rows, 1 dB a dot up to 24) growing right, the number riding on the tip
function drawGr(b, x, cy) {
  // a line 3 × the threshold line, 2 px a dB up to 24, the number riding on its tip;
  // a ground exactly the number's font height, from the line's left end to the number's right edge
  const dis = b.byp, g = dis ? 0 : b.gr, len = clamp(g / 24, 0, 1) * 48;
  const tip = len > 0 ? x + len + 2.5 : x, str = g >= 0.05 ? '-' + g.toFixed(1) : '0.0';
  R(x, cy - TINY.size / 2, tip + tw(str, TINY) - x, TINY.size, C.cell);
  if (len > 0) lineH(x, x + len, cy, dis ? C.dKnob : C.acc, 1.5);
  T(str, tip, cy, TINY, dis ? C.dText : g >= 0.05 ? C.acc : C.ink3);
}

function drawLogo() {
  const L = Lat(COL_L + 10, 25.5), on = new Path2D(), acc = new Path2D();   // the logo takes the heading place
  ['M', 'B', 'C', '4'].forEach((ch, n) =>
    LOGO[ch].forEach((row, r) => [...row].forEach((bit, c) => { if (bit === '1') L.add(n === 3 ? acc : on, n * 6 + c, r); })));
  ctx.fillStyle = C.ink; ctx.fill(on);
  ctx.fillStyle = C.acc; ctx.fill(acc);
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.cell; ctx.fillRect(0, 0, cv.width, cv.height);

  // rules only
  // no dividers: the blocks are set apart by the grid alone

  drawLogo();
  if (ioOpen) { header('INPUT', COL_R + 10, 65); header('OUTPUT', OUT_COL + 10, 65); }

  drawGraph();
  if (ioOpen) { drawMeter(IN_X, meters.in, meters.inPk); drawMeter(OUT_X, meters.out, meters.outPk); }
  for (let i = 0; i < 4; ++i) drawBand(i);

  for (const ct of ctls) {
    if (ct.side && !ioOpen) continue;
    if (ct.kind === 'io') T('I/O', ct.r[0] + ct.r[2] / 2, ct.r[1] + ct.r[3] / 2, LABEL, ioOpen ? C.acc : hot === ct ? C.ink : C.ink3, 'center');
    else if (ct.kind === 'v') drawV(ct);
    else if (ct.kind === 'h') drawH(ct);
    else if (ct.kind === 't') {
      const [x, y, w, h] = ct.r;
      T(ct.label, x + w / 2, y + h / 2, LABEL, ct.b[ct.key] ? C.acc : hot === ct ? C.ink : C.ink3, 'center');
    } else if (ct.kind === 'match') {
      const [x, y, w, h] = ct.r, dis = ct.b.byp;
      pill(x, y, w, h, C.off);
      T('MATCH', x + w / 2, y + h / 2, LABEL, dis ? C.dText : ct.b.learn ? C.acc : C.ink, 'center');
    } else if (ct.kind === 'size') {
      const cur = Math.abs(zoom - ct.v) < 0.005;
      T(ct.label, ct.r[0] + ct.r[2] / 2, FOOT_Y, NOTE, cur || hot === ct ? C.ink : C.ink3, 'center');
    } else if (ct.kind === 'icon') {
      icon(ct.act, ct.r[0] + ct.r[2] / 2, FOOT_Y, hot === ct ? C.ink : C.ink3);
    }
  }

  // footer: version on the left, stepped resize corner in the window's corner
  T('V1.2.0', 20, FOOT_Y, NOTE, C.ink3);
  for (let r = 0; r < 3; ++r) for (let c = 2 - r; c < 3; ++c) R(W - 13 + 4 * c, H - 13 + 4 * r, 3, 3, C.ink3);

  // bubbles (graph only)
  const h = drag ? drag.h : hot;
  if (h && h.kind === 'thr') bubble('ABCD'[h.i] + '  ' + fdB(bands[h.i].thr), mouse.x, dy(bands[h.i].thr) - 12);
  else if (h && h.kind === 'xo') bubble(fHz(xo[h.i]), fx(xo[h.i]), PY0 + 10);
  else if (h && h.kind === 'plot') bubble(fHz(xf(mouse.x)) + '  ' + num(yd(mouse.y)) + ' dB', mouse.x, mouse.y - 14);
}

// ───────────────────────────────── interaction
let drag = null, hot = null;
const mouse = { x: -100, y: -100 };
const inR = (r, p) => p.x >= r[0] && p.x < r[0] + r[2] && p.y >= r[1] && p.y < r[1] + r[3];
const isHot = (kind, i) => { const h = drag ? drag.h : hot; return h && h.kind === kind && h.i === i; };
const isDrag = ct => drag && drag.h === ct;
function pos(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / s, y: (e.clientY - b.top) / s }; }

function hitAll(p) {
  for (const ct of ctls) if (!(ct.side && !ioOpen) && (inR(ct.r, p) || (ct.onMeter && inR(ct.vr, p)))) return ct;
  if (p.x >= PX0 - 3 && p.x <= PX1 + 3 && p.y >= PY0 && p.y <= PY1) {
    for (let i = 0; i < 3; ++i) if (Math.abs(p.x - fx(xo[i])) <= 4) return { kind: 'xo', i };
    const i = bandOf(xf(p.x));
    if (Math.abs(p.y - dy(bands[i].thr)) <= 4) return { kind: 'thr', i };
    return { kind: 'plot' };
  }
  return null;
}

function defaultOf(h, p) {
  if (h.kind === 'v' || h.kind === 'h') h.obj[h.key] = h.def;
  else if (h.kind === 'thr') bands[h.i].thr = SP.thr.def;
  else if (h.kind === 'plot') bands[bandOf(xf(p.x))].thr = SP.thr.def;
  else if (h.kind === 'xo') xo[h.i] = XO_DEF[h.i];
}
function resetAll() {
  ctls.forEach(ct => { if (ct.kind === 'v' || ct.kind === 'h') ct.obj[ct.key] = ct.def; });
  bands.forEach(b => { b.thr = SP.thr.def; b.solo = b.mute = b.byp = false; });
  XO_DEF.forEach((f, i) => xo[i] = f);
}
function setZoom(z) { zoom = z; fit(); }

// ───────────────────────────────── undo / redo: one drag, wheel gesture or click = one step (keyboard only)
const snapState = () => JSON.stringify([bands.map(b => [b.thr, b.rat, b.kne, b.atk, b.rls, b.gain, b.mix, b.solo, b.mute, b.byp]), xo, G.gin, G.gout, G.mix, G.look]);
function loadState(js) {
  const [bs, x, gin, gout, mix, look] = JSON.parse(js);
  bs.forEach((v, i) => { const b = bands[i]; [b.thr, b.rat, b.kne, b.atk, b.rls, b.gain, b.mix, b.solo, b.mute, b.byp] = v; });
  x.forEach((f, i) => xo[i] = f); Object.assign(G, { gin, gout, mix, look });
}
const undoStack = [], redoStack = [];
let committed = snapState(), lastWheel = 0;
function commit() {
  if (drag || ed.style.display === 'block' || performance.now() - lastWheel < 400) return;
  const now = snapState();
  if (now === committed) return;
  undoStack.push(committed); if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0; committed = now;
}
function undo() { commit(); if (undoStack.length) { redoStack.push(committed); committed = undoStack.pop(); loadState(committed); } }
function redo() { commit(); if (redoStack.length) { undoStack.push(committed); committed = redoStack.pop(); loadState(committed); } }
addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || ed.style.display === 'block') return;
  const key = e.key.toLowerCase();
  if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((key === 'z' && e.shiftKey) || key === 'y') { e.preventDefault(); redo(); }
});

cv.addEventListener('pointerdown', e => {
  const p = pos(e), h = hitAll(p);
  hideTip();
  if (!h) return;
  cv.setPointerCapture(e.pointerId);
  if (e.altKey) { if (h.kind === 'size') setZoom(BASE); else defaultOf(h, p); return; }
  if (h.kind === 'size') { setZoom(h.v); return; }
  if (h.kind === 'io') { ioOpen = !ioOpen; layoutIo(); buildFooter(); fit(); return; }
  if (h.kind === 'icon') { if (h.act === 'reset') resetAll(); else applyTheme(theme === 'light' ? 'dark' : 'light'); return; }
  if (h.kind === 'corner') { drag = { h, x0: e.clientX, y0: e.clientY, z0: zoom }; return; }
  if (h.kind === 'v' || h.kind === 'h') drag = { h, ax: p.x, ay: p.y, n0: h.sp.m.n(h.obj[h.key]), fine: e.shiftKey };
  else if (h.kind === 'thr') drag = { h, off: p.y - dy(bands[h.i].thr) };
  else if (h.kind === 'xo') drag = { h };
  else if (h.kind === 't') h.b[h.key] = !h.b[h.key];
  else if (h.kind === 'match' && !h.b.byp) h.b.learn = h.b.learn ? null : { t0: performance.now() / 1000, sum: 0, n: 0 };
});
cv.addEventListener('pointermove', e => {
  const p = pos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (drag && drag.h.kind === 'corner') {
    const dz = Math.max(e.clientX - drag.x0, (e.clientY - drag.y0) * W / H) / W;
    setZoom(clamp(drag.z0 + dz, 0.75 * BASE, 1.25 * BASE)); return;
  }
  if (drag) { applyDrag(p, e.shiftKey); return; }
  hot = hitAll(p);
  cv.style.cursor = !hot ? 'default' : hot.kind === 'thr' || hot.kind === 'plot' || hot.kind === 'v' ? 'ns-resize'
                  : hot.kind === 'xo' || hot.kind === 'h' ? 'ew-resize' : hot.kind === 'corner' ? 'nwse-resize'
                  : hot.kind === 'gr' ? 'default' : 'pointer';
  schedTip(hot, e);
});
cv.addEventListener('pointerup', () => { drag = null; });
cv.addEventListener('pointerleave', () => { if (!drag) { hot = null; hideTip(); } });

function applyDrag(p, fine) {
  const h = drag.h;
  if (h.kind === 'v' || h.kind === 'h') {
    if (fine !== drag.fine) { drag.n0 = h.sp.m.n(h.obj[h.key]); drag.ax = p.x; drag.ay = p.y; drag.fine = fine; }
    const d = h.kind === 'v' ? (drag.ay - p.y) / 160 : (p.x - drag.ax) / 128;
    h.obj[h.key] = snap(h.sp, h.sp.m.v(clamp(drag.n0 + d * (fine ? 0.2 : 1), 0, 1)), fine);
  } else if (h.kind === 'thr') {
    bands[h.i].thr = snap(SP.thr, yd(p.y - drag.off), fine);
  } else if (h.kind === 'xo') {
    let f = xf(p.x);
    const e = Math.pow(10, Math.floor(Math.log10(f)) - (fine ? 2 : 1));
    f = Math.round(f / e) * e;
    const lo = h.i === 0 ? 25 : xo[h.i - 1] * 1.25, hi = h.i === 2 ? 16000 : xo[h.i + 1] / 1.25;
    xo[h.i] = clamp(f, lo, hi);
  }
}

cv.addEventListener('dblclick', e => {
  const p = pos(e), h = hitAll(p);
  if (!h) return;
  if ((h.kind === 'v' || h.kind === 'h') && inR(h.vr, p)) edit(h); else defaultOf(h, p);
});

cv.addEventListener('wheel', e => {
  const h = hitAll(pos(e));
  if (!h || (h.kind !== 'v' && h.kind !== 'h')) return;
  e.preventDefault();
  lastWheel = performance.now();
  const sp = h.sp, dir = e.deltaY < 0 ? 1 : -1, v = h.obj[h.key];
  if (sp.list && !e.shiftKey) {
    const idx = sp.list.indexOf(snap(sp, v, false));
    h.obj[h.key] = sp.list[clamp(idx + dir, 0, sp.list.length - 1)];
  } else h.obj[h.key] = snap(sp, v + dir * (e.shiftKey ? sp.fine : sp.step), e.shiftKey);
}, { passive: false });

// direct entry on the value text
const ed = document.getElementById('edit');
function edit(h) {
  const b = cv.getBoundingClientRect(), r = h.vr;
  Object.assign(ed.style, { display: 'block', left: b.left + r[0] * s + 'px', top: b.top + r[1] * s + 'px',
    width: r[2] * s + 'px', height: r[3] * s + 'px', fontSize: 9 * s + 'px' });
  ed.value = num(h.obj[h.key]);
  ed.focus(); ed.select();
  const close = () => { ed.style.display = 'none'; ed.onkeydown = ed.onblur = null; };
  const apply = () => { const v = parseFloat(ed.value); if (!isNaN(v)) h.obj[h.key] = clamp(v, h.sp.min, h.sp.max); close(); };
  ed.onkeydown = ev => { if (ev.key === 'Enter') apply(); else if (ev.key === 'Escape') close(); };
  ed.onblur = apply;
}

// tooltips: 0.5 s hover, never on the graph (bubbles live there)
const tip = document.getElementById('tip');
let tipTimer = null, tipKey = null, lastClient = { x: 0, y: 0 };
function schedTip(h, e) {
  lastClient = { x: e.clientX, y: e.clientY };
  if (!h || !h.tip) { hideTip(); return; }
  if (tipKey === h.tipKey) return;
  hideTip(); tipKey = h.tipKey;
  tipTimer = setTimeout(() => {
    tip.querySelector('.h').textContent = h.tip[0];
    tip.querySelector('.b').textContent = h.tip[1];
    Object.assign(tip.style, { display: 'block', padding: `${7 * s}px ${9 * s}px`, maxWidth: 220 * s + 'px' });
    Object.assign(tip.querySelector('.h').style, { fontSize: 8 * s + 'px', letterSpacing: 0.8 * s + 'px', marginBottom: 4 * s + 'px', color: C.acc });
    tip.querySelector('.b').style.fontSize = 10.5 * s + 'px';
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    let x = lastClient.x + 14, y = lastClient.y + 18;
    if (x + w > innerWidth - 8) x = lastClient.x - w - 10;
    if (y + hh > innerHeight - 8) y = lastClient.y - hh - 10;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }, 500);
}
function hideTip() { clearTimeout(tipTimer); tipTimer = null; tipKey = null; tip.style.display = 'none'; }

// ───────────────────────────────── run
let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (t - last < 15) return;                              // 60 Hz, like the plugin's display ticks
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  sim(t / 1000, dt);
  commit();
  draw();
}
addEventListener('resize', fit);
Promise.all([document.fonts.load('300 9px "Chivo Mono"'), document.fonts.load('400 8px "Chivo Mono"')])
  .catch(() => {}).finally(() => { fit(); buildFooter(); requestAnimationFrame(loop); });
</script>
