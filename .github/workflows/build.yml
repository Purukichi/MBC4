name: build

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install cargo-truce
        run: cargo install cargo-truce --version 6.3.0 --locked

      - name: Tests
        run: cargo test --release --lib

      - name: Build VST3 / CLAP / AU
        run: cargo truce build --vst3 --clap --au2

      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          cd target/bundles
          for b in *.vst3 *.clap *.component; do
            codesign --force --deep --sign - "$b"
            ditto -c -k --keepParent "$b" "../../dist/MBC4-mac-${b##*.}.zip"
          done
          cd ../..
          for z in dist/*.zip; do zip -j "$z" resources/fonts/OFL.txt; done

      - uses: actions/upload-artifact@v4
        with:
          name: MBC4-macOS
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-truce
        run: cargo install cargo-truce --version 6.3.0 --locked

      - name: Tests
        run: cargo test --release --lib

      - name: Build VST3 / CLAP
        run: cargo truce build --vst3 --clap

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/bundles -Filter *.vst3 | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath dist/MBC4-win-VST3.zip }
          Get-ChildItem target/bundles -Filter *.clap | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath dist/MBC4-win-CLAP.zip }
          Get-ChildItem dist/*.zip | ForEach-Object { Compress-Archive -Update -Path resources/fonts/OFL.txt -DestinationPath $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: MBC4-Windows
          path: dist/*.zip
