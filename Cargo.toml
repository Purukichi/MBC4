[package]
name = "mbc4"
version = "2.0.0"
description = "MBC4 4-band multiband compressor"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "mbc4-standalone"
path = "src/main.rs"
required-features = ["standalone"]

# CLAP + VST3 + standalone by default; AU v2 (macOS) with `cargo truce build --au2`.
[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
# Flags any allocation the DSP makes on the audio thread in `process`.
# Dev/test only: `cargo test --features rt-paranoid`.
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
truce-core = { version = "6.3" }
truce-params = { version = "6.3" }
# Custom-painted editor (cells, faders) on egui.
truce-egui = { version = "6.3" }
egui = "0.34"
# spectrum analyser (editor side only)
realfft = "3"
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-au = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

[dev-dependencies]
truce-test = { version = "6.3" }

# truce-egui 6.3.0 with the MSP1 patches: egui's cursor icon reaches the plugin
# window, and keyboard focus is only held while typing (vendor/truce-egui).
[patch.crates-io]
truce-egui = { path = "vendor/truce-egui" }

# Custom profile for `cargo truce install --shell`.
[profile.shell]
inherits = "release"
